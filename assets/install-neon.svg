<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="neonTitle neonDesc">
  <title id="neonTitle">LuminarisMD quick install</title>
  <desc id="neonDesc">Terminal neon bertuliskan QUICK INSTALL dengan perintah curl untuk menyalin dan menempel di terminal.</desc>

  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 0.5 0.5;360 0.5 0.5" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="cardBg" cx="0.5" cy="0" r="1.05">
      <stop offset="0" stop-color="#0c1b33"/>
      <stop offset="0.62" stop-color="#070d18"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.14"/>
    </pattern>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e0f2fe" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="18" y="12" width="864" height="226" rx="20"/>
    </clipPath>

    <clipPath id="cmdClip">
      <rect x="46" y="120" width="808" height="64" rx="12"/>
    </clipPath>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- kartu terminal -->
  <rect x="18" y="12" width="864" height="226" rx="20" fill="url(#cardBg)"/>
  <rect x="18" y="12" width="864" height="226" rx="20" fill="url(#dots)"/>
  <rect x="18.5" y="12.5" width="863" height="225" rx="19.5" fill="none" stroke="#12304d" stroke-width="1"/>

  <!-- border neon berdenyut -->
  <rect x="19" y="13" width="862" height="224" rx="19" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.30;0.85;0.30" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="19" y="13" width="862" height="224" rx="19" fill="none" stroke="url(#neon)" stroke-width="1.4" opacity="0.9"/>

  <!-- garis judul jendela -->
  <line x1="18" y1="54" x2="882" y2="54" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- tombol jendela -->
  <circle cx="44" cy="33" r="5" fill="#ff5f57"/>
  <circle cx="64" cy="33" r="5" fill="#febc2e"/>
  <circle cx="84" cy="33" r="5" fill="#28c840"/>

  <text x="106" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#7c93ad">luminarismd — quick install</text>

  <!-- label live -->
  <rect x="742" y="21" width="122" height="24" rx="12" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.45"/>
  <circle cx="759" cy="33" r="3.5" fill="#22d3ee" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="770" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="1.6" fill="#67e8f9">ONE COMMAND</text>

  <!-- judul -->
  <text x="46" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="3.2" fill="#38bdf8" opacity="0.85">LUMINARISMD COMMUNITY</text>

  <text x="46" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="1.2" fill="#e0f2fe" filter="url(#glow)">QUICK <tspan fill="#67e8f9">INSTALL</tspan></text>

  <rect x="708" y="84" width="146" height="28" rx="14" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="781" y="103" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="1.4" fill="#a5f3fc">SATU PERINTAH</text>

  <!-- kotak perintah -->
  <rect x="46" y="120" width="808" height="64" rx="12" fill="#050a12" stroke="#1e3a5f"/>
  <rect x="46" y="120" width="4" height="64" rx="2" fill="url(#neon)" opacity="0.9"/>

  <text x="66" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#64748b">$ <tspan fill="#e2e8f0">curl -LsSf https://raw.githubusercontent.com</tspan></text>
  <text x="66" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#7dd3fc">  /froegeg/LuminarisMD-Community/main/install.sh <tspan fill="#94a3b8">|</tspan> sh</text>

  <!-- kursor berkedip -->
  <rect x="520" y="155" width="8" height="15" rx="1" fill="#22d3ee" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.05;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- kilau menyapu -->
  <g clip-path="url(#cmdClip)">
    <rect x="-180" y="118" width="150" height="70" fill="url(#sheen)" transform="skewX(-18)">
      <animate attributeName="x" values="-220;980" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanline lembut -->
  <g clip-path="url(#cardClip)">
    <rect x="18" y="54" width="864" height="1.5" fill="url(#neon)" opacity="0.18">
      <animate attributeName="y" values="54;224;54" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.22;0.05" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- petunjuk copy paste -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5">
    <rect x="46" y="198" width="58" height="20" rx="5" fill="#0b1a2e" stroke="#1d4ed8" stroke-opacity="0.7"/>
    <text x="75" y="212" text-anchor="middle" letter-spacing="1" fill="#93c5fd">COPY</text>

    <text x="112" y="212" fill="#22d3ee">&#8594;</text>

    <rect x="126" y="198" width="62" height="20" rx="5" fill="#0b1a2e" stroke="#1d4ed8" stroke-opacity="0.7"/>
    <text x="157" y="212" text-anchor="middle" letter-spacing="1" fill="#93c5fd">PASTE</text>

    <text x="196" y="212" fill="#22d3ee">&#8594;</text>

    <rect x="210" y="198" width="62" height="20" rx="5" fill="#0b1a2e" stroke="#1d4ed8" stroke-opacity="0.7"/>
    <text x="241" y="212" text-anchor="middle" letter-spacing="1" fill="#93c5fd">ENTER</text>

    <text x="288" y="212" fill="#64748b">klik ikon copy di kanan blok kode, tempel di terminal</text>
  </g>
</svg>
